# Applied on top of the Creality presets for both parts. See MANIFEST.md
# "Print settings". Runs at 235 °C nozzle / 70 °C bed (proven on Insignia PETG
# after PID tuning on our stock PTFE-lined Ender 3 Pro hotend).
temperature = 235
first_layer_temperature = 235
bed_temperature = 70
first_layer_bed_temperature = 70
min_fan_speed = 30
max_fan_speed = 50
perimeters = 4
fill_density = 40%
seam_position = rear
skirts = 1
brim_width = 0
elefant_foot_compensation = 0.2
# Arachne with 0.42 mm lines prints the 0.84 mm arms as two outlines, no gap fill.
perimeter_generator = arachne
perimeter_extrusion_width = 0.42
external_perimeter_extrusion_width = 0.42
