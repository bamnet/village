# Applied on top of the Creality presets for both parts. See MANIFEST.md
# "Print settings". Temperatures follow the Insignia PETG label (nozzle
# 240 - 260, bed 60 - 70 °C), capped at the stock hotend's 240 °C.
temperature = 240
first_layer_temperature = 240
bed_temperature = 70
first_layer_bed_temperature = 70
min_fan_speed = 30
max_fan_speed = 50
perimeters = 4
fill_density = 40%
seam_position = rear
skirts = 1
brim_width = 0
elefant_foot_compensation = 0.2
# Arachne with 0.5 mm lines prints the 1.0 mm arms as two outlines, no gap fill.
perimeter_generator = arachne
perimeter_extrusion_width = 0.5
external_perimeter_extrusion_width = 0.5
